<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Circular clip path (daura) -->
    <clipPath id="circleView">
      <circle cx="250" cy="250" r="250" />
    </clipPath>

    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050A1A" />
    </linearGradient>

    <!-- Filament Glow Gradient -->
    <linearGradient id="filamentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE6A7" />
      <stop offset="40%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>

    <!-- Glass Bulb Gradient -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.02)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <!-- Base Metal Gradient -->
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A202C" />
      <stop offset="50%" stop-color="#4A5568" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Upward Beam Gradient -->
    <linearGradient id="beamGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(245, 166, 35, 0.6)" />
      <stop offset="100%" stop-color="rgba(255, 230, 167, 0)" />
    </linearGradient>
  </defs>

  <!-- Kila kitu kitaingizwa kwenye duara -->
  <g clip-path="url(#circleView)">
    <!-- Background -->
    <rect width="500" height="500" fill="url(#bgGradient)" />

    <!-- Subtle Tech Grid Background -->
    <g opacity="0.3">
      <path d="M 0 250 L 500 250 M 250 0 L 250 500" stroke="#1C2541" stroke-width="1" />
      <circle cx="250" cy="250" r="180" fill="none" stroke="#1C2541" stroke-width="1" />
      <circle cx="250" cy="250" r="280" fill="none" stroke="#1C2541" stroke-width="0.5" />
      <circle cx="250" cy="250" r="80" fill="none" stroke="#1C2541" stroke-width="0.5" stroke-dasharray="4 4" />
    </g>

    <!-- ================= MAIN LOGO GROUP ================= -->
    <!-- Tumesogeza juu kidogo na kupunguza ukubwa ili kutoshea kwenye duara -->
    <g transform="translate(0, -10) scale(0.85)">
      
      <!-- Upward Light Beams (taa igeukie juu) -->
      <g opacity="0.8">
        <polygon points="250,60 180,10 320,10" fill="url(#beamGradient)" />
        <polygon points="250,60 140,-20 220,-20" fill="url(#beamGradient)" opacity="0.5" />
        <polygon points="250,60 280,-20 360,-20" fill="url(#beamGradient)" opacity="0.5" />
        <polygon points="250,60 100,-30 150,-30" fill="url(#beamGradient)" opacity="0.3" />
        <polygon points="250,60 350,-30 400,-30" fill="url(#beamGradient)" opacity="0.3" />
      </g>

      <!-- 1. Glass Bulb (Edison Vintage Shape) -->
      <path d="M 250 100 
               C 150 100, 100 150, 100 240 
               C 100 320, 150 370, 190 400 
               C 200 410, 200 430, 200 440 
               L 300 440 
               C 300 430, 300 410, 310 400 
               C 350 370, 400 320, 400 240 
               C 400 150, 350 100, 250 100 Z" 
            fill="url(#glassGradient)" 
            stroke="#4A5568" 
            stroke-width="2" />

      <!-- Glass Reflection/Highlight -->
      <path d="M 120 230 
               C 120 160, 160 110, 240 100 
               C 160 110, 130 160, 135 240 
               C 135 270, 140 300, 155 330 
               C 145 300, 120 270, 120 230 Z" 
            fill="rgba(255, 255, 255, 0.15)" />

      <path d="M 170 120 C 200 105, 230 100, 250 100 C 220 110, 180 130, 170 120 Z" 
            fill="rgba(255, 255, 255, 0.2)" />

      <!-- 2. Internal Support Structure -->
      <path d="M 245 380 L 245 320 L 255 320 L 255 380 Z" fill="rgba(255, 255, 255, 0.05)" />
      <path d="M 250 310 L 250 380" stroke="#718096" stroke-width="3" />
      <path d="M 230 330 L 250 310 L 270 330" stroke="#718096" stroke-width="2.5" />
      
      <!-- 3. Glowing Filament -->
      <g filter="url(#outerGlow)">
        <circle cx="250" cy="260" r="50" fill="none" stroke="url(#filamentGradient)" stroke-width="2.5" />
        <ellipse cx="250" cy="260" rx="50" ry="15" fill="none" stroke="url(#filamentGradient)" stroke-width="1.5" />
        <ellipse cx="250" cy="230" rx="35" ry="8" fill="none" stroke="url(#filamentGradient)" stroke-width="1" />
        <ellipse cx="250" cy="290" rx="35" ry="8" fill="none" stroke="url(#filamentGradient)" stroke-width="1" />
        <ellipse cx="250" cy="260" rx="15" ry="50" fill="none" stroke="url(#filamentGradient)" stroke-width="1.5" />
        <ellipse cx="250" cy="260" rx="50" ry="15" transform="rotate(45 250 260)" fill="none" stroke="url(#filamentGradient)" stroke-width="1" stroke-dasharray="4 2" />
        <ellipse cx="250" cy="260" rx="50" ry="15" transform="rotate(-45 250 260)" fill="none" stroke="url(#filamentGradient)" stroke-width="1" stroke-dasharray="4 2" />
        <circle cx="250" cy="260" r="6" fill="#FFFFFF" />
        <circle cx="250" cy="260" r="3" fill="#F5A623" />
        <path d="M 250 220 L 250 240" stroke="#FFE6A7" stroke-width="2" />
        <path d="M 240 225 L 250 215 L 260 225" fill="none" stroke="#FFE6A7" stroke-width="1.5" />
      </g>

      <g filter="url(#innerGlow)">
        <path d="M 210 240 L 230 245 L 230 260" fill="none" stroke="#FFE6A7" stroke-width="1.5" />
        <path d="M 290 280 L 270 275 L 270 260" fill="none" stroke="#FFE6A7" stroke-width="1.5" />
        <path d="M 230 280 L 240 270 L 250 270" fill="none" stroke="#FFE6A7" stroke-width="1.5" />
        <path d="M 270 240 L 260 250 L 250 250" fill="none" stroke="#FFE6A7" stroke-width="1.5" />
      </g>

      <!-- Floating Particles -->
      <g fill="#F5A623" filter="url(#innerGlow)">
        <circle cx="190" cy="200" r="2.5" />
        <circle cx="310" cy="300" r="3" />
        <circle cx="200" cy="320" r="1.5" />
        <circle cx="300" cy="210" r="2" />
        <circle cx="180" cy="270" r="1" />
        <circle cx="320" cy="250" r="1.5" />
        <circle cx="220" cy="170" r="2" />
        <circle cx="280" cy="160" r="1.5" />
        <circle cx="250" cy="140" r="2.5" />
      </g>

      <!-- 4. Vintage Edison Screw Base -->
      <g>
        <rect x="195" y="440" width="110" height="8" rx="2" fill="#1A202C" stroke="#4A5568" stroke-width="1" />
        <rect x="210" y="448" width="80" height="12" rx="3" fill="url(#metalGradient)" stroke="#4A5568" stroke-width="1" />
        <rect x="205" y="460" width="90" height="8" rx="2" fill="#1A202C" stroke="#4A5568" stroke-width="1" />
        <rect x="215" y="468" width="70" height="14" rx="3" fill="url(#metalGradient)" stroke="#4A5568" stroke-width="1" />
        <rect x="210" y="482" width="80" height="8" rx="2" fill="#1A202C" stroke="#4A5568" stroke-width="1" />
        <rect x="220" y="490" width="60" height="12" rx="3" fill="url(#metalGradient)" stroke="#4A5568" stroke-width="1" />
        <rect x="230" y="502" width="40" height="6" rx="1" fill="#718096" />
      </g>
    </g>

    <!-- 5. Wordmark: "AT SKYFALL" and "WE WILL STAND TALL" zimewekwa chini ya duara -->
    <g text-anchor="middle">
      <text x="250" y="440" font-family="'Helvetica Neue', 'Inter', sans-serif" font-size="28" font-weight="700" fill="#E2E8F0" letter-spacing="5">
        AT SKYFALL
      </text>
      <text x="250" y="465" font-family="'Helvetica Neue', 'Inter', sans-serif" font-size="11" font-weight="400" fill="#F5A623" letter-spacing="3">
        WE WILL STAND TALL
      </text>
    </g>
  </g>
</svg>