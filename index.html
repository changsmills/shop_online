<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Skyfall",
      "alternateName": "Skyfall Tanzania",
      "url": "https://www.skyfall.co.tz",
      "logo": "https://www.skyfall.co.tz/web-app-manifest-512x512.png",
      "description": "Skyfall ni soko kuu la kidijitali Tanzania linalounganisha wauzaji wa jumla na rejareja nchi nzima.",
      "sameAs": [
        "https://www.facebook.com/skyfall_tz",
        "https://www.instagram.com/skyfall_tz",
        "https://www.twitter.com/skyfall_tz",
        "https://www.linkedin.com/company/skyfall_tz"
      ]
    }
    </script>

    <!-- Favicon (RealFaviconGenerator) -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Search Favicon Fix (Gawanyo la 48x48) -->
    <link rel="icon" type="image/png" sizes="512x512" href="/web-app-manifest-512x512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/web-app-manifest-192x192.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover"
    />

    <!-- SEO -->
    <meta
      name="description"
      content="Skyfall is Tanzania's premier B2B and B2C marketplace connecting wholesale and retail sellers with buyers nationwide. Safe, fast, and reliable e-commerce."
    />

    <meta name="author" content="Joshua Julius" />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Google Fonts — PLUS JAKARTA SANS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
     />

    <!-- Title -->
    <title>Skyfall | Smart Business Platform</title>

    <!-- Base CSS -->
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont,
        'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      }

      body {
        background: #ffffff;
        color: #0f172a;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1220;
          color: #f1f5f9;
        }
      }

      img.circular-logo,
      .logo-img {
        border-radius: 50%;
        object-fit: cover;
      }

      #root:empty::before {
        content: '';
        display: block;
        width: 36px;
        height: 36px;
        margin: 40vh auto 0;
        border: 3px solid rgba(255, 106, 0, 0.2);
        border-top-color: #ff6a00;
        border-radius: 50%;
        animation: bootspin 0.8s linear infinite;
      }

      @keyframes bootspin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="portal-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
